<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAM TOURNAMENT ZONE - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#0f172a;
  color:white;
  padding:15px;
}

.container{
  max-width:1100px;
  margin:auto;
}

h1{
  text-align:center;
  margin:15px 0 5px;
}

.subtitle{
  text-align:center;
  color:#94a3b8;
  margin-bottom:20px;
}

.card{
  background:#1e293b;
  padding:20px;
  border-radius:15px;
  margin-bottom:18px;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  margin:7px 0 12px;
  border:1px solid #475569;
  border-radius:8px;
  background:#0f172a;
  color:white;
  font-size:15px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

button{
  border:0;
  padding:11px 16px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  margin:4px;
}

.login-btn{
  background:#22c55e;
  color:white;
  width:100%;
}

.add-btn{
  background:#2563eb;
  color:white;
}

.edit-btn{
  background:#f59e0b;
  color:black;
}

.delete-btn{
  background:#ef4444;
  color:white;
}

.players-btn{
  background:#8b5cf6;
  color:white;
}

.logout-btn{
  background:#64748b;
  color:white;
  float:right;
}

.hidden{
  display:none;
}

.message{
  margin-top:10px;
  padding:10px;
  background:#334155;
  border-radius:8px;
}

.success{
  background:#166534;
}

.error{
  background:#991b1b;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:18px;
}

.stat{
  background:#1e293b;
  padding:20px;
  text-align:center;
  border-radius:12px;
}

.stat h2{
  color:#38bdf8;
  font-size:28px;
  word-break:break-word;
}

.stat p{
  color:#94a3b8;
  margin-top:5px;
}

.tournament{
  background:#0f172a;
  padding:16px;
  border-radius:12px;
  margin-bottom:12px;
  border:1px solid #334155;
}

.tournament h3{
  color:#38bdf8;
  margin-bottom:8px;
}

.info{
  color:#cbd5e1;
  line-height:1.7;
}

.players{
  background:#111827;
  margin-top:10px;
  padding:12px;
  border-radius:8px;
}

.player{
  padding:10px;
  border-bottom:1px solid #334155;
  line-height:1.6;
}

.loading{
  text-align:center;
  padding:20px;
  color:#94a3b8;
}

.empty{
  text-align:center;
  padding:20px;
  color:#94a3b8;
}

@media(max-width:700px){
  .stats{
    grid-template-columns:1fr;
  }

  button{
    width:100%;
    margin:5px 0;
  }

  .logout-btn{
    width:auto;
  }
}
</style>
</head>

<body>

<div class="container">

<h1>🎮 MAM TOURNAMENT ZONE</h1>

<div class="subtitle">
ADMIN PANEL
</div>


<!-- LOGIN -->

<div id="loginBox" class="card">

<h2>🔐 Admin Login</h2>

<br>

<input
  id="loginEmail"
  type="email"
  placeholder="Admin Email"
>

<input
  id="loginPassword"
  type="password"
  placeholder="Password"
>

<button
  class="login-btn"
  onclick="loginAdmin()"
>
🔐 Login
</button>

<div
  id="loginMessage"
  class="message hidden"
></div>

</div>


<!-- ADMIN PANEL -->

<div id="adminPanel" class="hidden">

<button
  class="logout-btn"
  onclick="logoutAdmin()"
>
Logout
</button>

<div style="clear:both"></div>

<br>


<!-- STATS -->

<div class="stats">

<div class="stat">
<h2 id="totalTournaments">0</h2>
<p>Total Tournaments</p>
</div>

<div class="stat">
<h2 id="totalPlayers">0</h2>
<p>Total Joined Players</p>
</div>

<div class="stat">
<h2 id="adminEmail" style="font-size:16px">-</h2>
<p>Admin</p>
</div>

</div>


<!-- CREATE TOURNAMENT -->

<div class="card">

<h2 id="formTitle">
➕ Create Tournament
</h2>

<br>

<input
  type="hidden"
  id="editId"
>

<label>Tournament Name</label>

<input
  id="title"
  type="text"
  placeholder="MAM Free Fire Tournament"
>


<label>Mode</label>

<select id="mode">

<option value="Solo">Solo</option>
<option value="Duo">Duo</option>
<option value="Squad">Squad</option>

</select>


<label>Date</label>

<input
  id="date"
  type="date"
>


<label>Time</label>

<input
  id="time"
  type="time"
>


<label>Description</label>

<textarea
  id="description"
  placeholder="Tournament সম্পর্কে বিস্তারিত লিখুন..."
></textarea>


<button
  class="add-btn"
  onclick="saveTournament()"
>
💾 Save Tournament
</button>


<button
  id="cancelEditBtn"
  class="hidden"
  onclick="clearForm()"
>
❌ Cancel
</button>


<div
  id="formMessage"
  class="message hidden"
></div>

</div>


<!-- TOURNAMENT MANAGEMENT -->

<div class="card">

<h2>🏆 Tournament Management</h2>

<br>

<div
  id="tournamentList"
  class="loading"
>
Loading...
</div>

</div>

</div>

</div>


<script>

/* =========================================
   SUPABASE CONFIG
   ========================================= */

const SUPABASE_URL =
"https://gxnijfjzigbxvibgtvwj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_kegdIDq_ppqQF302sJXVWA_v_fzHc7E";


const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   MESSAGE
   ========================================= */

function message(id,text,type="normal"){

  const box =
  document.getElementById(id);

  box.innerText = text;

  box.classList.remove(
    "hidden",
    "success",
    "error"
  );

  if(type === "success"){
    box.classList.add("success");
  }

  if(type === "error"){
    box.classList.add("error");
  }
}


/* =========================================
   LOGIN
   ========================================= */

async function loginAdmin(){

  const email =
  document
  .getElementById("loginEmail")
  .value
  .trim();

  const password =
  document
  .getElementById("loginPassword")
  .value;


  if(!email || !password){

    message(
      "loginMessage",
      "Email এবং Password দিন।",
      "error"
    );

    return;
  }


  message(
    "loginMessage",
    "Login হচ্ছে..."
  );


  const {
    error
  } =
  await supabaseClient.auth.signInWithPassword({

    email:email,
    password:password

  });


  if(error){

    message(
      "loginMessage",
      "Login হয়নি: " + error.message,
      "error"
    );

    return;
  }


  await checkAdmin();

}


/* =========================================
   CHECK ADMIN
   ========================================= */

async function checkAdmin(){

  const {
    data:{
      user
    }
  } =
  await supabaseClient
  .auth
  .getUser();


  if(!user){

    return;
  }


  const {
    data:admin,
    error
  } =
  await supabaseClient
  .from("admins")
  .select("id,email,user_id")
  .eq("user_id",user.id)
  .maybeSingle();


  if(error){

    message(
      "loginMessage",
      "Admin check error: " +
      error.message,
      "error"
    );

    return;
  }


  if(!admin){

    await supabaseClient
    .auth
    .signOut();

    message(
      "loginMessage",
      "এই account Admin হিসেবে যোগ করা নেই।",
      "error"
    );

    return;
  }


  document
  .getElementById("loginBox")
  .classList
  .add("hidden");


  document
  .getElementById("adminPanel")
  .classList
  .remove("hidden");


  document
  .getElementById("adminEmail")
  .innerText =
  admin.email || user.email;


  await loadTournaments();

}


/* =========================================
   LOAD TOURNAMENTS
   ========================================= */

async function loadTournaments(){

  const list =
  document.getElementById(
    "tournamentList"
  );


  list.innerHTML =
  '<div class="loading">Loading...</div>';


  const {
    data,
    error
  } =
  await supabaseClient
  .from("tournaments")
  .select("*")
  .order(
    "created_at",
    {
      ascending:false
    }
  );


  if(error){

    list.innerHTML =
    '<div class="message error">' +
    "Tournament load হয়নি: " +
    escapeHtml(error.message) +
    "</div>";

    return;
  }


  const tournaments =
  data || [];


  document
  .getElementById("totalTournaments")
  .innerText =
  tournaments.length;


  if(tournaments.length === 0){

    list.innerHTML =
    '<div class="empty">' +
    "এখনো কোনো Tournament তৈরি হয়নি।" +
    "</div>";

    document
    .getElementById("totalPlayers")
    .innerText = "0";

    return;
  }


  list.innerHTML = "";


  let totalPlayers = 0;


  for(
    const tournament
    of tournaments
  ){

    const count =
    await getPlayerCount(
      tournament.id
    );


    totalPlayers += count;


    const div =
    document.createElement("div");


    div.className =
    "tournament";


    div.innerHTML = `

      <h3>
      🎮 ${escapeHtml(
        tournament.title || "-"
      )}
      </h3>

      <div class="info">

      🎯 Game:
      ${escapeHtml(
        tournament.game || "Free Fire"
      )}

      <br>

      👥 Mode:
      ${escapeHtml(
        tournament.mode || "-"
      )}

      <br>

      📅 Date:
      ${escapeHtml(
        tournament.date || "-"
      )}

      <br>

      ⏰ Time:
      ${escapeHtml(
        tournament.time || "-"
      )}

      <br>

      👤 Joined:
      ${count} Players

      <br>

      📝 Description:
      ${escapeHtml(
        tournament.description || "-"
      )}

      </div>

      <br>

      <button
        class="edit-btn"
        onclick="editTournament('${tournament.id}')"
      >
      ✏️ Edit
      </button>

      <button
        class="delete-btn"
        onclick="deleteTournament('${tournament.id}')"
      >
      🗑️ Delete
      </button>

      <button
        class="players-btn"
        onclick="showPlayers('${tournament.id}')"
      >
      👥 Players
      </button>

      <div
        id="players-${tournament.id}"
        class="players hidden"
      ></div>

    `;


    list.appendChild(div);

  }


  document
  .getElementById("totalPlayers")
  .innerText =
  totalPlayers;

}


/* =========================================
   PLAYER COUNT
   ========================================= */

async function getPlayerCount(id){

  const {
    count,
    error
  } =
  await supabaseClient
  .from("tournament_players")
  .select(
    "id",
    {
      count:"exact",
      head:true
    }
  )
  .eq(
    "tournament_id",
    id
  );


  if(error){

    console.log(error);

    return 0;
  }


  return count || 0;

}


/* =========================================
   SHOW PLAYERS
   ========================================= */

async function showPlayers(id){

  const box =
  document.getElementById(
    "players-" + id
  );


  box.classList.toggle("hidden");


  if(
    box.classList.contains("hidden")
  ){

    return;

  }


  box.innerHTML =
  '<div class="loading">Players Loading...</div>';


  const {
    data,
    error
  } =
  await supabaseClient
  .from("tournament_players")
  .select(`
    id,
    player_name,
    free_fire_uid,
    free_fire_name,
    whatsapp,
    joined_at
  `)
  .eq(
    "tournament_id",
    id
  )
  .order(
    "joined_at",
    {
      ascending:false
    }
  );


  if(error){

    box.innerHTML =
    '<div class="message error">' +
    "Players load হয়নি: " +
    escapeHtml(error.message) +
    "</div>";

    return;
  }


  if(!data || data.length === 0){

    box.innerHTML =
    '<div class="empty">' +
    "এই Tournament-এ এখনো কেউ Join করেনি।" +
    "</div>";

    return;
  }


  box.innerHTML = "";


  data.forEach(
    (player,index)=>{

      const div =
      document.createElement("div");


      div.className =
      "player";


      div.innerHTML = `

      <b>
      #${index + 1}
      ${escapeHtml(
        player.player_name || "-"
      )}
      </b>

      <br>

      🆔 UID:
      ${escapeHtml(
        player.free_fire_uid || "-"
      )}

      <br>

      🎮 FF Name:
      ${escapeHtml(
        player.free_fire_name || "-"
      )}

      <br>

      📱 WhatsApp:
      ${escapeHtml(
        player.whatsapp || "-"
      )}

      `;


      box.appendChild(div);

    }
  );

}


/* =========================================
   SAVE TOURNAMENT
   ========================================= */

async function saveTournament(){

  const editId =
  document
  .getElementById("editId")
  .value;


  const title =
  document
  .getElementById("title")
  .value
  .trim();


  const mode =
  document
  .getElementById("mode")
  .value;


  const date =
  document
  .getElementById("date")
  .value;


  const time =
  document
  .getElementById("time")
  .value;


  const description =
  document
  .getElementById("description")
  .value
  .trim();


  if(!title){

    message(
      "formMessage",
      "Tournament Name দিন।",
      "error"
    );

    return;
  }


  /* EDIT */

  if(editId){

    const {
      error
    } =
    await supabaseClient
    .from("tournaments")
    .update({

      title:title,
      game:"Free Fire",
      mode:mode,
      date:date || null,
      time:time || null,
      description:description || null

    })
    .eq(
      "id",
      editId
    );


    if(error){

      message(
        "formMessage",
        "Update হয়নি: " +
        error.message,
        "error"
      );

      return;
    }


    message(
      "formMessage",
      "Tournament Update হয়েছে।",
      "success"
    );

  }


  /* CREATE */

  else{

    const {
      error
    } =
    await supabaseClient
    .from("tournaments")
    .insert({

      title:title,
      game:"Free Fire",
      mode:mode,
      date:date || null,
      time:time || null,
      description:description || null

    });


    if(error){

      message(
        "formMessage",
        "Tournament তৈরি হয়নি: " +
        error.message,
        "error"
      );

      return;
    }


    message(
      "formMessage",
      "Tournament তৈরি হয়েছে।",
      "success"
    );

  }


  clearForm();

  await loadTournaments();

}


/* =========================================
   EDIT
   ========================================= */

async function editTournament(id){

  const {
    data,
    error
  } =
  await supabaseClient
  .from("tournaments")
  .select("*")
  .eq(
    "id",
    id
  )
  .single();


  if(error){

    alert(
      "Data পাওয়া যায়নি: " +
      error.message
    );

    return;
  }


  document
  .getElementById("editId")
  .value =
  data.id;


  document
  .getElementById("title")
  .value =
  data.title || "";


  document
  .getElementById("mode")
  .value =
  data.mode || "Solo";


  document
  .getElementById("date")
  .value =
  data.date || "";


  document
  .getElementById("time")
  .value =
  data.time || "";


  document
  .getElementById("description")
  .value =
  data.description || "";


  document
  .getElementById("formTitle")
  .innerText =
  "✏️ Edit Tournament";


  document
  .getElementById("cancelEditBtn")
  .classList
  .remove("hidden");


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================
   DELETE
   ========================================= */

async function deleteTournament(id){

  const ok =
  confirm(
    "এই Tournament delete করতে চান?"
  );


  if(!ok){

    return;
  }


  const {
    error
  } =
  await supabaseClient
  .from("tournaments")
  .delete()
  .eq(
    "id",
    id
  );


  if(error){

    alert(
      "Delete হয়নি: " +
      error.message
    );

    return;
  }


  alert(
    "Tournament delete হয়েছে।"
  );


  await loadTournaments();

}


/* =========================================
   CLEAR FORM
   ========================================= */

function clearForm(){

  document
  .getElementById("editId")
  .value = "";


  document
  .getElementById("title")
  .value = "";


  document
  .getElementById("mode")
  .value = "Solo";


  document
  .getElementById("date")
  .value = "";


  document
  .getElementById("time")
  .value = "";


  document
  .getElementById("description")
  .value = "";


  document
  .getElementById("formTitle")
  .innerText =
  "➕ Create Tournament";


  document
  .getElementById("cancelEditBtn")
  .classList
  .add("hidden");

}


/* =========================================
   LOGOUT
   ========================================= */

async function logoutAdmin(){

  await supabaseClient
  .auth
  .signOut();

  location.reload();

}


/* =========================================
   ESCAPE HTML
   ========================================= */

function escapeHtml(value){

  return String(
    value ?? ""
  )

  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


/* =========================================
   AUTO CHECK LOGIN
   ========================================= */

checkAdmin();

</script>

</body>
</html>
