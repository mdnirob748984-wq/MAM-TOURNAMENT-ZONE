<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>MAM TOURNAMENT ZONE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#070b14;
    color:white;
}

header{
    background:#101827;
    border-bottom:1px solid #263248;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.logo{
    color:#00e5ff;
    font-size:20px;
    font-weight:bold;
}

.account{
    display:flex;
    align-items:center;
    gap:8px;
}

button{
    border:0;
    border-radius:8px;
    padding:11px 15px;
    font-weight:bold;
    cursor:pointer;
}

.login{
    background:#2563eb;
    color:white;
}

.logout{
    background:#ef4444;
    color:white;
}

main{
    max-width:950px;
    margin:auto;
    padding:20px 15px 60px;
}

.hero{
    text-align:center;
    padding:40px 10px;
}

.hero h1{
    color:#00e5ff;
    margin-bottom:10px;
}

.hero p{
    color:#9ca8bd;
}

.box{
    background:#101827;
    border:1px solid #263248;
    border-radius:14px;
    padding:18px;
    margin-bottom:25px;
}

.section-title{
    margin:25px 0 15px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:15px;
}

.card{
    background:#101827;
    border:1px solid #263248;
    border-radius:14px;
    padding:18px;
}

.card h3{
    color:#00e5ff;
    margin-bottom:12px;
}

.info{
    color:#c5cede;
    line-height:1.9;
}

.description{
    color:#9ca8bd;
    margin-top:10px;
    line-height:1.6;
}

.mode{
    display:inline-block;
    background:#172554;
    color:#93c5fd;
    padding:5px 10px;
    border-radius:20px;
    margin-top:10px;
    font-size:12px;
}

.join{
    width:100%;
    margin-top:15px;
    background:#00b8d4;
    color:#001017;
}

.empty{
    text-align:center;
    color:#9ca8bd;
    padding:25px;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    z-index:999;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal-box{
    width:100%;
    max-width:430px;
    max-height:90vh;
    overflow:auto;
    background:#101827;
    border:1px solid #263248;
    border-radius:15px;
    padding:20px;
}

.modal-box h2{
    color:#00e5ff;
    margin-bottom:18px;
}

.close{
    float:right;
    background:#ef4444;
    color:white;
    padding:6px 10px;
}

input{
    width:100%;
    padding:13px;
    margin-bottom:12px;
    background:#080d18;
    color:white;
    border:1px solid #344158;
    border-radius:8px;
    outline:none;
}

.primary{
    width:100%;
    background:#2563eb;
    color:white;
}

.secondary{
    width:100%;
    background:#263248;
    color:white;
    margin-top:8px;
}

.message{
    text-align:center;
    margin-top:12px;
    line-height:1.5;
}

.my-card{
    background:#101827;
    border:1px solid #263248;
    border-radius:14px;
    padding:16px;
    margin-bottom:12px;
}

.my-card h3{
    color:#00e5ff;
    margin-bottom:10px;
}

.leave{
    width:100%;
    margin-top:12px;
    background:#ef4444;
    color:white;
}

footer{
    text-align:center;
    padding:25px;
    color:#667085;
    border-top:1px solid #202b40;
}

@media(max-width:600px){
    .hero h1{
        font-size:26px;
    }
}
</style>
</head>

<body>

<header>

<div class="logo">
🎮 MAM TOURNAMENT ZONE
</div>

<div id="account" class="account">
<button class="login" onclick="openAuth()">
Login / Register
</button>
</div>

</header>


<main>

<section class="hero">

<h1>
🏆 Free Fire Tournament
</h1>

<p>
Welcome to MAM TOURNAMENT ZONE
</p>

</section>


<div
id="welcome"
class="box"
style="display:none"
></div>


<h2 class="section-title">
🎯 Available Tournaments
</h2>

<div
id="tournaments"
class="grid"
>

<div class="empty">
Tournament loading...
</div>

</div>


<section
id="mySection"
style="display:none"
>

<h2 class="section-title">
👤 My Tournaments
</h2>

<div id="myTournaments"></div>

</section>

</main>


<footer>
© 2026 MAM TOURNAMENT ZONE
</footer>


<!-- LOGIN -->

<div id="authModal" class="modal">

<div class="modal-box">

<button
class="close"
onclick="closeAuth()"
>
×
</button>

<h2 id="authTitle">
Login
</h2>

<input
id="email"
type="email"
placeholder="Email"
/>

<input
id="password"
type="password"
placeholder="Password"
/>

<button
id="authButton"
class="primary"
onclick="login()"
>
Login
</button>

<button
id="switchButton"
class="secondary"
onclick="switchMode()"
>
Create Account
</button>

<div
id="authMessage"
class="message"
></div>

</div>

</div>


<!-- JOIN -->

<div id="joinModal" class="modal">

<div class="modal-box">

<button
class="close"
onclick="closeJoin()"
>
×
</button>

<h2>
🎮 Join Tournament
</h2>

<div
id="joinInfo"
class="box"
></div>

<input
id="playerName"
placeholder="Your Name"
/>

<input
id="uid"
placeholder="Free Fire UID"
/>

<input
id="ffName"
placeholder="Free Fire Name"
/>

<input
id="whatsapp"
placeholder="WhatsApp Number"
/>

<button
id="joinButton"
class="primary"
onclick="joinTournament()"
>
Join Tournament
</button>

<div
id="joinMessage"
class="message"
></div>

</div>

</div>


<script>

/* ==========================================
SUPABASE
========================================== */

const SUPABASE_URL =
"https://gxnijfjzigbxvibgtvwj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_kegdIDq_ppqQF302sJXVWA_v_fzHc7E";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* ==========================================
VARIABLES
========================================== */

let registerMode = false;

let selectedTournament = null;


/* ==========================================
ESCAPE
========================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* ==========================================
AUTH
========================================== */

function openAuth(){

    document.getElementById(
        "authModal"
    ).style.display="flex";

}


function closeAuth(){

    document.getElementById(
        "authModal"
    ).style.display="none";

}


function switchMode(){

    registerMode=!registerMode;

    document.getElementById(
        "authTitle"
    ).innerText=
        registerMode
        ? "Create Account"
        : "Login";

    document.getElementById(
        "authButton"
    ).innerText=
        registerMode
        ? "Register"
        : "Login";

    document.getElementById(
        "switchButton"
    ).innerText=
        registerMode
        ? "Already have an account? Login"
        : "Create Account";

    document.getElementById(
        "authButton"
    ).onclick=
        registerMode
        ? register
        : login;

}


function authMsg(text,error=false){

    const box=
        document.getElementById(
            "authMessage"
        );

    box.innerText=text;

    box.style.color=
        error
        ? "#ff7070"
        : "#5ee69a";
}


/* ==========================================
LOGIN
========================================== */

async function login(){

    const email=
        document.getElementById(
            "email"
        ).value.trim();

    const password=
        document.getElementById(
            "password"
        ).value;

    if(!email || !password){

        authMsg(
            "Email এবং Password দিন।",
            true
        );

        return;
    }

    const button=
        document.getElementById(
            "authButton"
        );

    button.disabled=true;

    button.innerText="Logging in...";

    const {error}=
        await supabaseClient.auth
        .signInWithPassword({
            email,
            password
        });

    button.disabled=false;

    button.innerText="Login";

    if(error){

        authMsg(
            "Login হয়নি: "+error.message,
            true
        );

        return;
    }

    closeAuth();

    await updateAccount();

    await loadMyTournaments();
}


/* ==========================================
REGISTER
========================================== */

async function register(){

    const email=
        document.getElementById(
            "email"
        ).value.trim();

    const password=
        document.getElementById(
            "password"
        ).value;

    if(!email || !password){

        authMsg(
            "Email এবং Password দিন।",
            true
        );

        return;
    }

    if(password.length<6){

        authMsg(
            "Password কমপক্ষে ৬ অক্ষরের দিন।",
            true
        );

        return;
    }

    const {data,error}=
        await supabaseClient.auth
        .signUp({
            email,
            password
        });

    if(error){

        authMsg(
            "Registration হয়নি: "+
            error.message,
            true
        );

        return;
    }

    if(data.session){

        closeAuth();

        await updateAccount();

        await loadMyTournaments();

    }else{

        authMsg(
            "Account তৈরি হয়েছে। Email verification প্রয়োজন হতে পারে।"
        );

    }
}


/* ==========================================
ACCOUNT
========================================== */

async function updateAccount(){

    const {
        data
    }=
        await supabaseClient.auth
        .getUser();

    const account=
        document.getElementById(
            "account"
        );

    const welcome=
        document.getElementById(
            "welcome"
        );

    if(!data.user){

        account.innerHTML=`

        <button
        class="login"
        onclick="openAuth()"
        >
        Login / Register
        </button>

        `;

        welcome.style.display="none";

        document.getElementById(
            "mySection"
        ).style.display="none";

        return;
    }

    const user=data.user;

    const name=
        user.email?.split("@")[0] ||
        "Player";

    account.innerHTML=`

    <span>
    👤 ${escapeHtml(name)}
    </span>

    <button
    class="logout"
    onclick="logout()"
    >
    Logout
    </button>

    `;

    welcome.style.display="block";

    welcome.innerHTML=`

    👋 Welcome,
    <strong>
    ${escapeHtml(name)}
    </strong>

    <br>

    📧 ${escapeHtml(user.email)}

    `;
}


/* ==========================================
LOGOUT
========================================== */

async function logout(){

    await supabaseClient.auth.signOut();

    document.getElementById(
        "mySection"
    ).style.display="none";

    document.getElementById(
        "myTournaments"
    ).innerHTML="";

    await updateAccount();
}


/* ==========================================
LOAD TOURNAMENTS
========================================== */

async function loadTournaments(){

    const box=
        document.getElementById(
            "tournaments"
        );

    const {data,error}=
        await supabaseClient
        .from("tournaments")
        .select("*")
        .eq("game","Free Fire")
        .order(
            "created_at",
            {ascending:false}
        );

    if(error){

        box.innerHTML=`

        <div class="empty">
        Tournament load করা যায়নি।
        <br><br>
        ${escapeHtml(error.message)}
        </div>

        `;

        return;
    }

    if(!data || data.length===0){

        box.innerHTML=`

        <div class="empty">
        এখন কোনো Tournament নেই।
        </div>

        `;

        return;
    }

    box.innerHTML="";

    data.forEach(t=>{

        const card=
            document.createElement("div");

        card.className="card";

        const title=
            t.title ||
            "Free Fire Tournament";

        const mode=
            t.mode ||
            "Solo";

        card.innerHTML=`

        <h3>
        🎮 ${escapeHtml(title)}
        </h3>

        <div class="info">

        📅 Date:
        ${escapeHtml(t.date || "Not set")}

        <br>

        ⏰ Time:
        ${escapeHtml(t.time || "Not set")}

        <br>

        🎯 Game:
        Free Fire

        </div>

        <span class="mode">
        ${escapeHtml(mode)}
        </span>

        ${
            t.description
            ?
            `
            <div class="description">
            ${escapeHtml(t.description)}
            </div>
            `
            :
            ""
        }

        <button
        class="join"
        onclick='openJoin(${JSON.stringify({
            id:t.id,
            title:title,
            mode:mode,
            date:t.date,
            time:t.time
        })})'
        >
        🎮 Join Tournament
        </button>

        `;

        box.appendChild(card);

    });
}


/* ==========================================
OPEN JOIN
========================================== */

async function openJoin(tournament){

    const {data}=
        await supabaseClient.auth
        .getUser();

    if(!data.user){

        alert(
            "Tournament Join করতে আগে Login করুন।"
        );

        openAuth();

        return;
    }

    selectedTournament=tournament;

    document.getElementById(
        "joinInfo"
    ).innerHTML=`

    <strong>
    ${escapeHtml(tournament.title)}
    </strong>

    <br>

    🎮 Mode:
    ${escapeHtml(tournament.mode)}

    <br>

    📅 Date:
    ${escapeHtml(tournament.date || "Not set")}

    <br>

    ⏰ Time:
    ${escapeHtml(tournament.time || "Not set")}

    `;

    document.getElementById(
        "playerName"
    ).value="";

    document.getElementById(
        "uid"
    ).value="";

    document.getElementById(
        "ffName"
    ).value="";

    document.getElementById(
        "whatsapp"
    ).value="";

    document.getElementById(
        "joinMessage"
    ).innerText="";

    document.getElementById(
        "joinModal"
    ).style.display="flex";
}


/* ==========================================
CLOSE JOIN
========================================== */

function closeJoin(){

    document.getElementById(
        "joinModal"
    ).style.display="none";

    selectedTournament=null;
}


/* ==========================================
JOIN
========================================== */

async function joinTournament(){

    const message=
        document.getElementById(
            "joinMessage"
        );

    const playerName=
        document.getElementById(
            "playerName"
        ).value.trim();

    const uid=
        document.getElementById(
            "uid"
        ).value.trim();

    const ffName=
        document.getElementById(
            "ffName"
        ).value.trim();

    const whatsapp=
        document.getElementById(
            "whatsapp"
        ).value.trim();

    if(!playerName ||
       !uid ||
       !ffName){

        message.innerText=
            "Name, UID এবং Free Fire Name দিন.";

        message.style.color="#ff7070";

        return;
    }

    if(
        whatsapp &&
        !/^01[3-9]\d{8}$/.test(whatsapp)
    ){

        message.innerText=
            "সঠিক ১১ সংখ্যার WhatsApp নম্বর দিন।";

        message.style.color="#ff7070";

        return;
    }

    const {data}=
        await supabaseClient.auth
        .getUser();

    if(!data.user){

        message.innerText=
            "আগে Login করুন।";

        message.style.color="#ff7070";

        return;
    }

    const user=data.user;

    const {data:existing,error:checkError}=
        await supabaseClient
        .from("tournament_players")
        .select("id")
        .eq(
            "tournament_id",
            selectedTournament.id
        )
        .eq(
            "user_id",
            user.id
        )
        .maybeSingle();

    if(checkError){

        message.innerText=
            checkError.message;

        message.style.color="#ff7070";

        return;
    }

    if(existing){

        message.innerText=
            "আপনি এই Tournament-এ আগেই Join করেছেন।";

        message.style.color="#ffcc66";

        return;
    }

    const button=
        document.getElementById(
            "joinButton"
        );

    button.disabled=true;

    button.innerText="Joining...";

    const {error}=
        await supabaseClient
        .from("tournament_players")
        .insert({

            tournament_id:
                selectedTournament.id,

            user_id:
                user.id,

            player_name:
                playerName,

            free_fire_uid:
                uid,

            free_fire_name:
                ffName,

            whatsapp:
                whatsapp || null

        });

    button.disabled=false;

    button.innerText="Join Tournament";

    if(error){

        message.innerText=
            "Join করা যায়নি: "+
            error.message;

        message.style.color="#ff7070";

        return;
    }

    message.innerText=
        "🎉 Tournament Join সফল হয়েছে!";

    message.style.color="#5ee69a";

    setTimeout(
        async()=>{
            closeJoin();
            await loadMyTournaments();
        },
        700
    );
}


/* ==========================================
MY TOURNAMENTS
========================================== */

async function loadMyTournaments(){

    const section=
        document.getElementById(
            "mySection"
        );

    const list=
        document.getElementById(
            "myTournaments"
        );

    section.style.display="none";

    const {data}=
        await supabaseClient.auth
        .getUser();

    if(!data.user){

        list.innerHTML="";

        return;
    }

    section.style.display="block";

    list.innerHTML=`
    <div class="empty">
    Loading...
    </div>
    `;

    const {data:joins,error}=
        await supabaseClient
        .from("tournament_players")
        .select("*")
        .eq(
            "user_id",
            data.user.id
        )
        .order(
            "joined_at",
            {ascending:false}
        );

    if(error){

        list.innerHTML=`

        <div class="empty">
        ${escapeHtml(error.message)}
        </div>

        `;

        return;
    }

    if(!joins || joins.length===0){

        list.innerHTML=`

        <div class="empty">
        আপনি এখনো কোনো Tournament Join করেননি।
        </div>

        `;

        return;
    }

    const ids=
        joins.map(
            x=>x.tournament_id
        );

    const {data:tournaments}=
        await supabaseClient
        .from("tournaments")
        .select("*")
        .in("id",ids);

    list.innerHTML="";

    joins.forEach(join=>{

        const t=
            tournaments?.find(
                x =>
                String(x.id) ===
                String(join.tournament_id)
            );

        const card=
            document.createElement("div");

        card.className="my-card";

        card.innerHTML=`

        <h3>
        🎮 ${escapeHtml(
            t?.title ||
            "Free Fire Tournament"
        )}
        </h3>

        <div class="info">

        🎮 Mode:
        ${escapeHtml(
            t?.mode || "Solo"
        )}

        <br>

        📅 Date:
        ${escapeHtml(
            t?.date || "Not set"
        )}

        <br>

        ⏰ Time:
        ${escapeHtml(
            t?.time || "Not set"
        )}

        <br>

        👤 Player:
        ${escapeHtml(
            join.player_name
        )}

        <br>

        🆔 Free Fire UID:
        ${escapeHtml(
            join.free_fire_uid
        )}

        <br>

        🎮 Free Fire Name:
        ${escapeHtml(
            join.free_fire_name
        )}

        </div>

        <button
        class="leave"
        onclick="leaveTournament('${join.id}')"
        >
        Leave Tournament
        </button>

        `;

        list.appendChild(card);

    });
}


/* ==========================================
LEAVE
========================================== */

async function leaveTournament(id){

    if(
        !confirm(
            "আপনি কি Tournament থেকে Leave করতে চান?"
        )
    ){

        return;
    }

    const {error}=
        await supabaseClient
        .from("tournament_players")
        .delete()
        .eq("id",id);

    if(error){

        alert(
            "Leave করা যায়নি: "+
            error.message
        );

        return;
    }

    await loadMyTournaments();
}


/* ==========================================
AUTH STATE
========================================== */

supabaseClient.auth
.onAuthStateChange(
    ()=>{
        setTimeout(
            async()=>{
                await updateAccount();
                await loadMyTournaments();
            },
            0
        );
    }
);


/* ==========================================
START
========================================== */

async function start(){

    await updateAccount();

    await loadTournaments();

    await loadMyTournaments();

}

start();


/* ==========================================
OUTSIDE CLICK
========================================== */

window.addEventListener(
    "click",
    e=>{

        if(
            e.target ===
            document.getElementById(
                "authModal"
            )
        ){
            closeAuth();
        }

        if(
            e.target ===
            document.getElementById(
                "joinModal"
            )
        ){
            closeJoin();
        }

    }
);

</script>

</body>
</html>
