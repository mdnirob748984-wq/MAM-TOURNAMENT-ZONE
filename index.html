<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

MAM TOURNAMENT ZONE
</title>

<style>

/* =========================================
   BASIC
========================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


body{

    font-family:
        Arial,
        sans-serif;

    background:
        #070b14;

    color:#ffffff;

    min-height:100vh;

}


button{

    border:none;

    border-radius:9px;

    padding:11px 15px;

    font-weight:bold;

    cursor:pointer;

}


button:disabled{

    opacity:.6;

    cursor:not-allowed;

}


/* =========================================
   HEADER
========================================= */

header{

    position:sticky;

    top:0;

    z-index:100;

    background:#101827;

    border-bottom:
        1px solid #263248;

    padding:14px 16px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    flex-wrap:wrap;

}


.logo{

    color:#00e5ff;

    font-size:20px;

    font-weight:bold;

}


.account{

    display:flex;

    align-items:center;

    gap:8px;

    flex-wrap:wrap;

}


/* =========================================
   BUTTONS
========================================= */

.login-btn{

    background:#2563eb;

    color:#fff;

}


.logout-btn{

    background:#ef4444;

    color:#fff;

}


.join-btn{

    width:100%;

    margin-top:15px;

    background:#00b8d4;

    color:#001017;

}


.secondary-btn{

    width:100%;

    background:#263248;

    color:#fff;

    margin-top:8px;

}


.delete-btn{

    background:#ef4444;

    color:#fff;

    margin-top:12px;

    width:100%;

}


/* =========================================
   MAIN
========================================= */

main{

    max-width:1000px;

    margin:auto;

    padding:
        20px
        15px
        60px;

}


/* =========================================
   HERO
========================================= */

.hero{

    text-align:center;

    padding:
        42px 10px
        35px;

}


.hero h1{

    color:#00e5ff;

    font-size:32px;

    margin-bottom:10px;

}


.hero p{

    color:#9ca8bd;

}


/* =========================================
   WELCOME
========================================= */

.welcome{

    background:#101827;

    border:
        1px solid #263248;

    border-radius:14px;

    padding:16px;

    margin-bottom:25px;

    line-height:1.8;

}


.welcome strong{

    color:#00e5ff;

}


/* =========================================
   SECTION
========================================= */

.section{

    margin-top:30px;

}


.section-title{

    font-size:22px;

    margin-bottom:15px;

}


/* =========================================
   TOURNAMENT GRID
========================================= */

.tournament-grid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(280px,1fr)
        );

    gap:16px;

}


/* =========================================
   TOURNAMENT CARD
========================================= */

.tournament-card{

    background:#101827;

    border:
        1px solid #263248;

    border-radius:15px;

    padding:18px;

    transition:.2s;

}


.tournament-card:hover{

    border-color:#00e5ff;

    transform:
        translateY(-2px);

}


.tournament-card h3{

    color:#00e5ff;

    font-size:19px;

    margin-bottom:12px;

}


.info{

    color:#c6cfdf;

    line-height:2;

    font-size:14px;

}


.description{

    color:#9da9bd;

    margin-top:10px;

    line-height:1.7;

}


.available{

    display:inline-block;

    margin-top:12px;

    background:#123c2b;

    color:#61e6a0;

    padding:
        5px 10px;

    border-radius:20px;

    font-size:12px;

}


/* =========================================
   MY TOURNAMENTS
========================================= */

.my-card{

    background:#101827;

    border:
        1px solid #263248;

    border-radius:14px;

    padding:16px;

    margin-bottom:12px;

}


.my-card h3{

    color:#00e5ff;

    margin-bottom:10px;

}


.my-info{

    color:#c4ccdc;

    line-height:1.9;

    font-size:14px;

}


.joined{

    display:inline-block;

    margin-top:10px;

    background:#123c2b;

    color:#61e6a0;

    padding:6px 10px;

    border-radius:20px;

    font-size:12px;

}


.empty{

    background:#101827;

    border:
        1px solid #263248;

    border-radius:14px;

    padding:28px 20px;

    text-align:center;

    color:#9ca8bd;

}


/* =========================================
   MODAL
========================================= */

.modal{

    display:none;

    position:fixed;

    inset:0;

    z-index:1000;

    background:
        rgba(0,0,0,.80);

    align-items:center;

    justify-content:center;

    padding:15px;

}


.modal-box{

    width:100%;

    max-width:430px;

    max-height:90vh;

    overflow-y:auto;

    background:#101827;

    border:
        1px solid #2b3852;

    border-radius:16px;

    padding:22px;

}


.modal-box h2{

    color:#00e5ff;

    margin-bottom:18px;

}


.close-btn{

    float:right;

    background:#ef4444;

    color:#fff;

    padding:
        6px 10px;

}


input{

    width:100%;

    padding:13px;

    margin-bottom:12px;

    border:
        1px solid #344158;

    border-radius:9px;

    background:#080d18;

    color:#fff;

    outline:none;

}


input:focus{

    border-color:#00e5ff;

}


.primary-btn{

    width:100%;

    background:#2563eb;

    color:#fff;

}


.message{

    min-height:20px;

    margin-top:12px;

    text-align:center;

    font-size:14px;

    line-height:1.5;

}


/* =========================================
   FOOTER
========================================= */

footer{

    border-top:
        1px solid #202b40;

    padding:28px 15px;

    text-align:center;

    color:#667085;

    font-size:13px;

}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px){

    .logo{

        font-size:18px;

    }


    .hero h1{

        font-size:26px;

    }

}

</style>

</head>


<body>

HEADER

            </div>

        </div>

    </section>


</main>



<!-- =========================================
FOOTER
========================================= -->

<footer>

    © 2026 MAM TOURNAMENT ZONE

</footer>



<!-- =========================================
LOGIN MODAL
========================================= -->

<div
    class="modal"
    id="authModal"
>


    <div class="modal-box">


        <button
            class="close-btn"
            onclick="closeAuth()"
        >

            ×

        </button>


        <h2 id="authTitle">

            Login

        </h2>


        <input
            type="email"
            id="email"
            placeholder="Email"
        >


        <input
            type="password"
            id="password"
            placeholder="Password"
        >


        <button
            id="authButton"
            class="primary-btn"
            onclick="loginUser()"
        >

            Login

        </button>


        <button
            id="switchButton"
            class="secondary-btn"
            onclick="switchAuthMode()"
        >

            Create Account

        </button>


        <div
            id="authMessage"
            class="message"

        </div>


    </div>

</div>



<!-- =========================================
JOIN MODAL
========================================= -->

<div
    class="modal"
    id="joinModal"
>


    <div class="modal-box">


        <button
            class="close-btn"
            onclick="closeJoin()"
        >

            ×

        </button>

            🎮 Join Tournament

        </h2>


        <div
            id="joinTournamentTitle"

        >

            type="text"
            id="playerName"

        >


        <input
            type="text"
            id="freeFireUID"

        >


        <input
            type="text"

        >

            placeholder="WhatsApp Number"
        >


        <button
            id="joinSubmitButton"

        >

            ✅ Join Tournament

        </button>


        <div
            id="joinMessage"
            class="message"
        >

        </div>


    </div>

</div>



<script>


/* =================================================
   SUPABASE
================================================= */

const SUPABASE_URL =
"https://gxnijfjzigbxvibgtvwj.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_kegdIDq_ppqQF302sJXVWA_v_fzHc7E";


const supabaseClient =
window.supabase.createClient(

    SUPABASE_URL,

    SUPABASE_PUBLISHABLE_KEY

);



/* =================================================
   GLOBAL VARIABLES
================================================= */

let registerMode = false;

let currentTournament = null;



/* =================================================
   ESCAPE HTML
================================================= */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}



/* =================================================
   AUTH MODAL
================================================= */

function openAuth(){

    document
        .getElementById("authModal")
        .style.display =
        "flex";

}


function closeAuth(){

    document
        .getElementById("authModal")
        .style.display =
        "none";

}



/* =================================================
   AUTH MODE
================================================= */

function switchAuthMode(){

    registerMode =
        !registerMode;


    const title =
        document.getElementById(
            "authTitle"
        );


    const button =
        document.getElementById(
            "authButton"
        );


    const switchButton =
        document.getElementById(
            "switchButton"
        );


    if(registerMode){

        title.innerText =
            "Create Account";


        button.innerText =
            "Register";


        button.onclick =
            registerUser;


        switchButton.innerText =
            "Already have an account? Login";


    }else{

        title.innerText =
            "Login";


        button.innerText =
            "Login";


        button.onclick =
            loginUser;


        switchButton.innerText =
            "Create Account";

    }

}



/* =================================================
   MESSAGE
================================================= */

function authMessage(
    text,
    type=""
){

    const box =
        document.getElementById(
            "authMessage"
        );


    box.innerText =
        text;


    box.style.color =
        type === "error"

        ? "#ff7070"

        : type === "success"

        ? "#5ee69a"

        : "#aab4c8";

}



/* =================================================
   LOGIN
================================================= */

async function loginUser(){

    const email =
        document
            .getElementById("email")
            .value
            .trim();


    const password =
        document
            .getElementById("password")
            .value;


    if(!email){

        authMessage(
            "Email দিন।",
            "error"
        );

        return;

    }


    if(!password){

        authMessage(
            "Password দিন।",
            "error"
        );

        return;

    }


    const button =
        document.getElementById(
            "authButton"
        );


    button.disabled =
        true;

    button.innerText =
        "Logging in...";


    const {
        error
    } =
    await supabaseClient
        .auth
        .signInWithPassword({

            email,

            password

        });


    button.disabled =
        false;

    button.innerText =
        "Login";


    if(error){

        authMessage(
            "Login হয়নি: " +
            error.message,
            "error"
        );

        return;

    }


    authMessage(
        "Login সফল হয়েছে।",
        "success"
    );


    setTimeout(
        async function(){

            closeAuth();

            await updateAccount();

            await loadMyTournaments();

        },
        600
    );

}



/* =================================================
   REGISTER
================================================= */

async function registerUser(){

    const email =
        document
            .getElementById("email")
            .value
            .trim();


    const password =
        document
            .getElementById("password")
            .value;


    if(!email){

        authMessage(
            "Email দিন।",
            "error"
        );

        return;

    }


    if(!password){

        authMessage(
            "Password দিন।",
            "error"
        );

        return;

    }


    if(password.length < 6){

        authMessage(
            "Password কমপক্ষে ৬ অক্ষরের দিন।",
            "error"
        );

        return;

    }


    const button =
        document.getElementById(
            "authButton"
        );


    button.disabled =
        true;

    button.innerText =
        "Registering...";


    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .signUp({

            email,

            password

        });


    button.disabled =
        false;

    button.innerText =
        "Register";


    if(error){

        authMessage(
            "Registration হয়নি: " +
            error.message,
            "error"
        );

        return;

    }


    if(data.session){

        authMessage(
            "Registration সফল হয়েছে।",
            "success"
        );


        setTimeout(
            async function(){

                closeAuth();

                await updateAccount();

                await loadMyTournaments();

            },
            600
        );


    }else{

        authMessage(
            "Account তৈরি হয়েছে। Email verification প্রয়োজন হতে পারে।",
            "success"
        );

    }

}



/* =================================================
   ACCOUNT
================================================= */

async function updateAccount(){

    const account =
        document.getElementById(
            "accountArea"
        );


    const welcome =
        document.getElementById(
            "welcomeBox"
        );


    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getUser();


    if(
        error ||
        !data ||
        !data.user
    ){

        account.innerHTML = `

            <button
                class="login-btn"
                onclick="openAuth()"
            >

                Login / Register

            </button>

        `;


        welcome.style.display =
            "none";


        document
            .getElementById(
                "myTournamentSection"
            )
            .style.display =
            "none";


        return;

    }


    const user =
        data.user;


    const name =
        user.user_metadata?.name ||

        user.email
            ?.split("@")[0] ||

        "Player";


    account.innerHTML = `

        <span>

            👤
            ${escapeHtml(name)}

        </span>


        <button
            class="logout-btn"
            onclick="logout()"
        >

            Logout

        </button>

    `;


    welcome.style.display =
        "block";


    welcome.innerHTML = `

        👋 Welcome,
        <strong>
            ${escapeHtml(name)}
        </strong>

        <br>

        📧
        ${escapeHtml(
            user.email || ""
        )}

    `;

}



/* =================================================
   LOGOUT
================================================= */

async function logout(){

    await supabaseClient
        .auth
        .signOut();


    updateAccount();


    document
        .getElementById(
            "myTournamentSection"
        )
        .style.display =
        "none";

}



/* =================================================
   LOAD TOURNAMENTS
================================================= */

async function loadTournaments(){

    const list =
        document.getElementById(
            "tournamentList"
        );


    list.innerHTML = `

        <div class="empty">

            Tournament loading...

        </div>

    `;


    const {
        data,
        error
    } =
    await supabaseClient

        .from("tournaments")

        .select("*")

        .eq(
            "game",
            "Free Fire"
        )

        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);


        list.innerHTML = `

            <div class="empty">

                Tournament load করা যায়নি।

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;


        return;

    }


    if(
        !data ||
        data.length === 0
    ){

        list.innerHTML = `

            <div class="empty">

                🏆

                <br><br>

                এখন কোনো Tournament প্রকাশ করা হয়নি।

            </div>

        `;


        return;

    }


    list.innerHTML =
        "";


    data.forEach(
        function(tournament){

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "tournament-card";


            const title =
                tournament.title ||

                tournament.name ||

                "Free Fire Tournament";


            const date =
                tournament.date ||

                tournament.tournament_date ||

                tournament.match_date ||

                tournament.start_date ||

                "";


            const time =
                tournament.time ||

                tournament.tournament_time ||

                tournament.match_time ||

                tournament.start_time ||

                "";


            const description =
                tournament.description ||

                "";


            /*
               IMPORTANT:
               Tournament ID string হিসেবে নেওয়া হচ্ছে
               যাতে UUID / numeric ID দুটোই কাজ করতে পারে।
            */

            const tournamentId =
                String(
                    tournament.id
                );


            card.innerHTML = `

                <h3>

                    🎮
                    ${escapeHtml(title)}

                </h3>


                <div class="info">

                    📅 Date:
                    ${escapeHtml(
                        date || "Not set"
                    )}

                    <br>

                    ⏰ Time:
                    ${escapeHtml(
                        time || "Not set"
                    )}

                    <br>

                    🎯 Game:
                    Free Fire

                </div>


                ${
                    description

                    ?

                    `

                    <div class="description">

                        📝
                        ${escapeHtml(
                            description
                        )}

                    </div>

                    `

                    :

                    ""

                }


                <span class="available">

                    ● Available

                </span>


                <button
                    class="join-btn"
                    onclick='openJoin(${JSON.stringify(
                        {
                            id:tournamentId,
                            title:title,
                            date:date,
                            time:time
                        }
                    )})'
                >

                    🎮 Join Tournament

                </button>

            `;


            list.appendChild(
                card
            );

        }
    );

}



/* =================================================
   OPEN JOIN
================================================= */

async function openJoin(tournament){

    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getUser();


    if(
        error ||
        !data ||
        !data.user
    ){

        alert(
            "Tournament Join করতে আগে Login করুন।"
        );


        openAuth();

        return;

    }


    currentTournament =
        tournament;


    document
        .getElementById(
            "joinTournamentTitle"
        )
        .innerHTML = `

            <strong>

                🎮
                ${escapeHtml(
                    tournament.title
                )}

            </strong>

            <br>

            📅
            ${escapeHtml(
                tournament.date || "Not set"
            )}

            <br>

            ⏰
            ${escapeHtml(
                tournament.time || "Not set"
            )}

        `;


    document
        .getElementById(
            "playerName"
        )
        .value = "";


    document
        .getElementById(
            "freeFireUID"
        )
        .value = "";


    document
        .getElementById(
            "freeFireName"
        )
        .value = "";


    document
        .getElementById(
            "whatsapp"
        )
        .value = "";


    document
        .getElementById(
            "joinMessage"
        )
        .innerText = "";


    document
        .getElementById(
            "joinModal"
        )
        .style.display =
        "flex";

}



/* =================================================
   CLOSE JOIN
================================================= */

function closeJoin(){

    document
        .getElementById(
            "joinModal"
        )
        .style.display =
        "none";


    currentTournament =
        null;

}



/* =================================================
   SUBMIT JOIN
================================================= */

async function submitJoin(){

    const message =
        document.getElementById(
            "joinMessage"
        );


    message.style.color =
        "#aab4c8";


    const playerName =
        document
            .getElementById(
                "playerName"
            )
            .value
            .trim();


    const uid =
        document
            .getElementById(
                "freeFireUID"
            )
            .value
            .trim();


    const freeFireName =
        document
            .getElementById(
                "freeFireName"
            )
            .value
            .trim();


    const whatsapp =
        document
            .getElementById(
                "whatsapp"
            )
            .value
            .trim();


    if(!playerName){

        message.innerText =
            "Player Name দিন।";

        message.style.color =
            "#ff7070";

        return;

    }


    if(!uid){

        message.innerText =
            "Free Fire UID দিন।";

        message.style.color =
            "#ff7070";

        return;

    }


    if(!freeFireName){

        message.innerText =
            "Free Fire Name দিন।";

        message.style.color =
            "#ff7070";

        return;

    }


    if(
        whatsapp &&
        !/^01[3-9]\d{8}$/.test(
            whatsapp
        )
    ){

        message.innerText =
            "সঠিক ১১ সংখ্যার WhatsApp নম্বর দিন।";

        message.style.color =
            "#ff7070";

        return;

    }


    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getUser();


    if(
        error ||
        !data ||
        !data.user
    ){

        message.innerText =
            "আগে Login করুন।";

        message.style.color =
            "#ff7070";

        return;

    }


    const user =
        data.user;


    if(!currentTournament){

        message.innerText =
            "Tournament পাওয়া যায়নি।";

        message.style.color =
            "#ff7070";

        return;

    }


    const button =
        document.getElementById(
            "joinSubmitButton"
        );


    button.disabled =
        true;

    button.innerText =
        "Joining...";



    /* =========================================
       CHECK ALREADY JOINED
    ========================================= */

    const {
        data:existing,
        error:existingError
    } =
    await supabaseClient

        .from(
            "tournament_players"
        )

        .select("id")

        .eq(
            "tournament_id",
            String(
                currentTournament.id
            )
        )

        .eq(
            "user_id",
            user.id
        )

        .maybeSingle();


    if(existingError){

        console.error(
            existingError
        );


        button.disabled =
            false;

        button.innerText =
            "✅ Join Tournament";


        message.innerText =
            "তথ্য যাচাই করা যায়নি: " +
            existingError.message;

        message.style.color =
            "#ff7070";

        return;

    }


    if(existing){

        button.disabled =
            false;

        button.innerText =
            "✅ Join Tournament";


        message.innerText =
            "আপনি এই Tournament-এ আগেই Join করেছেন।";

        message.style.color =
            "#ffcc66";

        return;

    }



    /* =========================================
       INSERT
    ========================================= */

    const {
        error:insertError
    } =
    await supabaseClient

        .from(
            "tournament_players"
        )

        .insert({

            tournament_id:
                String(
                    currentTournament.id
                ),

            user_id:
                user.id,

            player_name:
                playerName,

            free_fire_uid:
                uid,

            free_fire_name:
                freeFireName,

            whatsapp:
                whatsapp || null

        });


    button.disabled =
        false;

    button.innerText =
        "✅ Join Tournament";


    if(insertError){

        console.error(
            insertError
        );


        message.innerText =
            "Join করা যায়নি: " +
            insertError.message;

        message.style.color =
            "#ff7070";

        return;

    }



    /* =========================================
       SUCCESS
    ========================================= */

    message.innerText =
        "🎉 Tournament Join সফল হয়েছে!";


    message.style.color =
        "#5ee69a";


    setTimeout(
        async function(){

            closeJoin();

            await loadMyTournaments();

        },
        900
    );

}



/* =================================================
   MY TOURNAMENTS
================================================= */

async function loadMyTournaments(){

    const section =
        document.getElementById(
            "myTournamentSection"
        );


    const list =
        document.getElementById(
            "myTournamentList"
        );


    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getUser();


    if(
        error ||
        !data ||
        !data.user
    ){

        section.style.display =
            "none";

        return;

    }


    section.style.display =
        "block";


    list.innerHTML = `

        <div class="empty">

            Loading...

        </div>

    `;


    const user =
        data.user;


    const {
        data:joins,
        error:joinError
    } =
    await supabaseClient

        .from(
            "tournament_players"
        )

        .select("*")

        .eq(
            "user_id",
            user.id
        )

        .order(
            "joined_at",
            {
                ascending:false
            }
        );


    if(joinError){

        console.error(
            joinError
        );


        list.innerHTML = `

            <div class="empty">

                My Tournaments load করা যায়নি।

                <br><br>

                ${escapeHtml(
                    joinError.message
                )}

            </div>

        `;


        return;

    }


    if(
        !joins ||
        joins.length === 0
    ){

        list.innerHTML = `

            <div class="empty">

                আপনি এখনো কোনো Tournament Join করেননি।

            </div>

        `;


        return;

    }


    /* =========================================
       LOAD TOURNAMENT DATA
    ========================================= */

    const {
        data:tournaments,
        error:tournamentError
    } =
    await supabaseClient

        .from("tournaments")

        .select("*");


    if(tournamentError){

        console.error(
            tournamentError
        );


        list.innerHTML = `

            <div class="empty">

                Tournament information load করা যায়নি।

            </div>

        `;


        return;

    }


    list.innerHTML =
        "";


    joins.forEach(
        function(join){

            const tournament =
                tournaments.find(
                    function(item){

                        return String(
                            item.id
                        ) === String(
                            join.tournament_id
                        );

                    }
                );


            const title =
                tournament?.title ||

                tournament?.name ||

                "Free Fire Tournament";


            const date =
                tournament?.date ||

                tournament?.tournament_date ||

                tournament?.match_date ||

                tournament?.start_date ||

                "Not set";


            const time =
                tournament?.time ||

                tournament?.tournament_time ||

                tournament?.match_time ||

                tournament?.start_time ||

                "Not set";


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "my-card";


            card.innerHTML = `

                <h3>

                    🎮
                    ${escapeHtml(title)}

                </h3>


                <div class="my-info">

                    📅 Date:
                    ${escapeHtml(date)}

                    <br>

                    ⏰ Time:
                    ${escapeHtml(time)}

                    <br>

                    👤 Player:
                    ${escapeHtml(
                        join.player_name
                    )}

                    <br>

                    🆔 Free Fire UID:
                    ${escapeHtml(
                        join.free_fire_uid
                    )}

                    <br>

                    🎮 Free Fire Name:
                    ${escapeHtml(
                        join.free_fire_name
                    )}

                    ${
                        join.whatsapp

                        ?

                        `

                        <br>

                        📱 WhatsApp:
                        ${escapeHtml(
                            join.whatsapp
                        )}

                        `

                        :

                        ""

                    }

                </div>


                <span class="joined">

                    ✓ Joined

                </span>


                <button
                    class="delete-btn"
                    onclick='leaveTournament(${JSON.stringify(
                        String(
                            join.id
                        )
                    )})'
                >

                    Leave Tournament

                </button>

            `;


            list.appendChild(
                card
            );

        }
    );

}



/* =================================================
   LEAVE TOURNAMENT
================================================= */

async function leaveTournament(
    joinId
){

    const confirmLeave =
        confirm(
            "আপনি কি এই Tournament থেকে Leave করতে চান?"
        );


    if(!confirmLeave){

        return;

    }


    const {
        error
    } =
    await supabaseClient

        .from(
            "tournament_players"
        )

        .delete()

        .eq(
            "id",
            joinId
        );


    if(error){

        alert(
            "Leave করা যায়নি: " +
            error.message
        );

        return;

    }


    await loadMyTournaments();

}



/* =================================================
   AUTH STATE
================================================= */

supabaseClient
    .auth
    .onAuthStateChange(
        function(){

            setTimeout(
                async function(){

                    await updateAccount();

                    await loadMyTournaments();

                },
                0
            );

        }
    );



/* =================================================
   MODAL OUTSIDE CLICK
================================================= */

window.addEventListener(
    "click",
    function(event){

        const authModal =
            document.getElementById(
                "authModal"
            );


        const joinModal =
            document.getElementById(
                "joinModal"
            );


        if(
            event.target ===
            authModal
        ){

            closeAuth();

        }


        if(
            event.target ===
            joinModal
        ){

            closeJoin();

        }

    }
);



/* =================================================
   START
================================================= */

async function startWebsite(){

    await updateAccount();

    await loadTournaments();

    await loadMyTournaments();

}


startWebsite();


</script>
